name: Publish to Instagram
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths: ["queue.json"]
permissions:
  contents: write
  actions: write
jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Publish due items
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841450740797891"
          PAWS_TOKEN: ${{ secrets.PAWS_TOKEN }}
          PAWS_IG_USER_ID: ""
          SCHOLAR_TOKEN: ${{ secrets.SCHOLAR_TOKEN }}
          SCHOLAR_IG_USER_ID: "17841467311335357"
          TVB_PAGE_ID: "1257088404148096"
          SCHOLAR_PAGE_ID: "1513418011847330"
          PAWS_PAGE_ID: "1528022250384132"
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 scripts/publish.py
      - name: Save queue status
        run: |
          if ! git diff --quiet queue.json; then
            git config user.name "tvb-bot"
            git config user.email "tvb-bot@users.noreply.github.com"
            git commit -am "queue: statut mis à jour"
            git pull --rebase && git push
          fi
  wake:
    # Le cron de GitHub est trop irrégulier : ce job dort jusqu'au prochain élément de queue.json puis relance le robot.
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 345
    concurrency:
      group: wake
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sleep until the next due item, then wake the robot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          s=$(python3 scripts/next_due.py)
          if [ "$s" -lt 0 ]; then echo "Rien en attente"; exit 0; fi
          echo "Réveil dans $s s"
          sleep "$s"
          gh workflow run publish.yml --ref main -R "${{ github.repository }}"
