name: Publish to Instagram
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    paths: ["queue.json"]
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish due items
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: "17841450740797891"
          PAWS_TOKEN: ${{ secrets.PAWS_TOKEN }}
          PAWS_IG_USER_ID: ""
          SCHOLAR_TOKEN: ${{ secrets.SCHOLAR_TOKEN }}
          SCHOLAR_IG_USER_ID: "17841467311335357"
          TVB_PAGE_ID: "1257088404148096"
          SCHOLAR_PAGE_ID: "1513418011847330"
          PAWS_PAGE_ID: ""
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python3 scripts/publish.py
      - name: Save queue status
        run: |
          if ! git diff --quiet queue.json; then
            git config user.name "tvb-bot"
            git config user.email "tvb-bot@users.noreply.github.com"
            git commit -am "queue: statut mis à jour"
            git pull --rebase && git push
          fi
