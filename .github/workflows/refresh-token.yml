name: Refresh Instagram token
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/refresh_token.py
      - name: Store new token
        if: steps.r.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: gh secret set IG_TOKEN < /tmp/new_token
